<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자기소개</title>
</head>
<body>

  <!-- 시맨틱 태그 1: header -->
  <header>
    <!-- 가장 중요한 제목 (h1) -->
    <h1>안녕하세요, 김선욱입니다.</h1>
    <!-- 한 줄 소개 문단 (p) -->
    <p>문제를 해결하고 가치를 만드는 소프트웨어 개발자를 꿈꾸고 있습니다.</p>
  </header>

  <!-- 시맨틱 태그 2: main -->
  <main>
    <!-- 시맨틱 태그 3: section -->
    <section>
      <h2>배우고 싶은 기술</h2>
      <!-- 기술 세 가지 목록 (ul, li) -->
      <ul>
        <li>FastAPI & 백엔드 최적화</li>
        <li>Generative AI & 물리적 AI 모델링</li>
        <li>클라우드 인프라 (GCP / Docker)</li>
      </ul>
    </section>

    <section>
      <h2>링크 및 바로가기</h2>
      <!-- GitHub 또는 자주 방문하는 사이트 링크 (a) -->
      <p>
        저의 코드가 궁금하다면: 
        <a href="https://github.com/0514swkim-web" target="_blank" rel="noopener noreferrer">
          GitHub 방문하기
        </a>
      </p>

      <!-- 클릭할 수 있는 버튼 (button) -->
      <button type="button" onclick="alert('방문해 주셔서 감사합니다!')">
        응원 메시지 남기기
      </button>
    </section>
  </main>

</body>
</html>
